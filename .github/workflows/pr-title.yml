name: Pull request title
# Runs on pull_request: since November 9, 2026, every pull_request_target run
# of this check failed at startup without details, blocking all merges. The
# checker still runs from the base revision; a PR can only change it by also
# editing this workflow, which review must catch. Titles are re-set when
# squash-merging, so the check is a guard, not a security boundary.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions: {}
jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check conventional title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check_pr_title.mts
